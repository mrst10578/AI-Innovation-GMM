name: Independent AI research source audit and estimation
on:
  push:
    branches:
      - 'research/ai-innovation-*'
    paths:
      - '.github/workflows/06-research-estimation.yml'
      - 'src/python/research_audit.py'
      - 'src/python/estimate_panel.py'
      - 'src/r/estimate_ai_panel.R'
      - 'src/gretl/estimate_ai_panel.inp'
      - 'MODEL_SPECIFICATION.md'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-python.txt
      - name: Audit real manuscript dictionary and original AI dataset
        run: python -m src.python.research_audit
      - name: Save non-row-level audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-source-audit
          path: outputs/research_source_audit.json
          if-no-files-found: warn
