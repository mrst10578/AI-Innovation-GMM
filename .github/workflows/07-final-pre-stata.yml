name: Final pre-Stata scientific audit and laptop bundle
on:
  push:
    branches:
      - 'research/ai-innovation-estimation-20261008'
    paths:
      - '.github/workflows/07-final-pre-stata.yml'
      - 'stata/**'
      - 'src/python/patent_forensics.py'
      - 'src/python/stata_static_audit.py'
      - 'src/python/build_stata_bundle.py'
      - 'STATA_START_HERE_FA.md'
      - 'MODEL_SPECIFICATION.md'
      - 'DEFENSE_GUIDE_FA.md'
      - 'reports/**'
      - 'docs/POST_STATA_AUDIT_FA.md'
      - 'validation/audit_real_stata.py'
      - 'validation/cset_provenance_gate.py'
      - 'validation/check_r_sensitivity_spec.py'
      - 'validation/check_mata_dh_static.py'
      - 'docs/STATA_MATA_DH_RETEST_FA.md'
      - 'docs/CSET_SOURCE_AND_GMM_IDENTIFICATION_AUDIT_FA.md'
      - 'docs/CSET_OFFICIAL_CROSSCHECK_RESULTS_FA.md'
      - 'validation/evidence/stata_model_summary_20261010.csv'
      - 'validation/source_provenance_manifest.json'
      - 'validation/source_identification_gate.py'
      - 'validation/cset_provenance_gate.py'
      - 'tests/test_source_identification_gate.py'
      - 'docs/CSET_SOURCE_AND_GMM_IDENTIFICATION_AUDIT_FA.md'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-and-bundle:
    name: Verify original research data, lint Stata statically, package originals
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic data and Stata DTA IO
        run: |
          python -m pip install "pandas>=2.1,<3" "numpy>=1.26,<3" "openpyxl>=3.1,<4"
      - name: Verify source checksum manifest
        run: sha256sum -c sources/SHA256SUMS.txt
      - name: Real-source country-level patent concentration and provenance audit
        run: python -m src.python.patent_forensics
      - name: Independently gate CSET source identity and time/location/metric assumptions
        run: python validation/cset_provenance_gate.py
      - name: Verify preregistered R China / instrument sensitivity code structure
        run: python validation/check_r_sensitivity_spec.py
      - name: Data preflight and Excel to DTA export (NOT Stata estimation)
        run: |
          python -m src.python.preflight
          python -m src.python.to_stata
      - name: Static validation of Stata code (NOT Stata execution)
        run: python -m src.python.stata_static_audit
      - name: Independently check optional Mata D-H diagnostic script, no licensed Stata claim
        run: python validation/check_mata_dh_static.py
      - name: Test Stata output validator against synthetic edge cases only
        run: PYTHONPATH=. python tests/test_stata_pipeline.py
      - name: Audit actual emailed Stata results separately from simulated static checks
        run: python validation/audit_real_stata.py
      - name: Upload actual Stata scientific QC (archived prior run)
        uses: actions/upload-artifact@v4
        with:
          name: AI-Innovation-Real-Stata-Scientific-QC
          path: outputs/real_stata_20261010_qc.json
          if-no-files-found: error
      - name: Official CSET/ETO source identity audit from original workbook (unverified matched vintage)
        run: python validation/cset_provenance_gate.py
      - name: Check evidence-based source and System GMM identification blockers
        run: |
          PYTHONPATH=. python tests/test_source_identification_gate.py
          python validation/source_identification_gate.py
      - name: Upload source and identification QC (may be BLOCKED, not a CI failure)
        uses: actions/upload-artifact@v4
        with:
          name: AI-Innovation-Source-Identification-Gate
          path: |
            outputs/source_identification_gate.json
            outputs/cset_provenance_gate.json
          if-no-files-found: error
      - name: Build exact-source portable laptop ZIP and verify manifest
        run: |
          python -m src.python.build_stata_bundle
          python -m zipfile -t dist/AI_Innovation_STATA_Ready.zip
      - name: Upload complete laptop package including original Excel and audited DTA
        uses: actions/upload-artifact@v4
        with:
          name: AI-Innovation-Stata-Laptop
          path: dist/AI_Innovation_STATA_Ready.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload forensic audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: AI-Innovation-PreStata-Evidence
          path: |
            outputs/source_forensics.json
            outputs/preflight_status.json
            outputs/cset_provenance_gate.json
          if-no-files-found: error
